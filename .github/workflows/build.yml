name: Build PiraChest

on:
  workflow_call:
    outputs:
      tag:
        description: "Git tag of this version"
        value: ${{ jobs.version.outputs.tag }}
      is_new:
        description: "'true' when a new GitHub release was created"
        value: ${{ jobs.version.outputs.is_new }}
      canary:
        description: "'1' for canary builds"
        value: ${{ jobs.version.outputs.canary }}
      display:
        description: "Human readable version"
        value: ${{ jobs.version.outputs.display }}
      app_name:
        description: "Application name"
        value: ${{ jobs.version.outputs.app_name }}
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.ver.outputs.base }}
      build: ${{ steps.ver.outputs.build }}
      base_build: ${{ steps.ver.outputs.base_build }}
      nickname: ${{ steps.ver.outputs.nickname }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      is_new: ${{ steps.ver.outputs.is_new }}
      canary: ${{ steps.ver.outputs.canary }}
      channel: ${{ steps.ver.outputs.channel }}
      slug: ${{ steps.ver.outputs.slug }}
      display: ${{ steps.ver.outputs.display }}
      app_name: ${{ steps.ver.outputs.app_name }}
    steps:
      - uses: actions/checkout@v5
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re

          lines = [line.strip() for line in open('VERSION', encoding='utf-8').read().splitlines() if line.strip()]
          if not lines:
              raise SystemExit('VERSION is empty')
          first = lines[0]
          match = re.match(r'(\d+\.\d+\.\d+)(?:[.-](\d+))?', first)
          if not match:
              raise SystemExit(f'Invalid VERSION: must start with X.Y.Z (got: {first})')
          base = match.group(1)
          build = match.group(2) or ''
          build_part = f'-{build}' if build else ''
          legacy = re.search(r'\(([^)]+)\)', first)
          nickname = legacy.group(1).strip() if legacy else ''
          canary = bool(re.search(r'(?:^|[-_.])canary(?:$|[-_.\s])', first, re.I))
          for line in lines[1:]:
              key, sep, value = line.partition('=')
              name = key.strip().lower()
              if sep and name in ('canary', 'is_canary'):
                  canary = value.strip().lower() in ('1', 'true', 'yes', 'on')
              elif sep and name in ('nickname', 'name'):
                  nickname = value.strip()
              elif line in ('0', '1'):
                  canary = line == '1'
              elif not nickname:
                  nickname = line
          nick_slug = re.sub(r'[^a-z0-9]+', '-', nickname.lower()).strip('-')
          channel = 'canary' if canary else 'stable'
          version = f'{base}-{channel}{build_part}' + (f'-{nick_slug}' if nick_slug else '')
          display = f'{base}-{channel}{build_part}' + (f' ({nickname})' if nickname else '')
          print(f'base={base}')
          print(f'build={build}')
          print(f'base_build={base}{build_part}')
          print(f'nickname={nickname}')
          print(f'version={version}')
          print(f'display={display}')
          print(f'tag=v{version}')
          print(f'canary={1 if canary else 0}')
          print(f'channel={channel}')
          print(f'slug={"PiraChest-Canary" if canary else "PiraChest"}')
          print(f'app_name={"PiraChest Canary" if canary else "PiraChest"}')
          PY
          TAG=$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -n1)
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Windows
    needs: version
    uses: ./.github/workflows/build-windows.yml
    with:
      base_build: ${{ needs.version.outputs.base_build }}
      nickname: ${{ needs.version.outputs.nickname }}
      canary: ${{ needs.version.outputs.canary }}
      version: ${{ needs.version.outputs.version }}
      slug: ${{ needs.version.outputs.slug }}
      app_name: ${{ needs.version.outputs.app_name }}
      channel: ${{ needs.version.outputs.channel }}

  build-linux:
    name: Linux
    needs: version
    uses: ./.github/workflows/build-linux.yml
    with:
      base_build: ${{ needs.version.outputs.base_build }}
      nickname: ${{ needs.version.outputs.nickname }}
      canary: ${{ needs.version.outputs.canary }}
      version: ${{ needs.version.outputs.version }}
      slug: ${{ needs.version.outputs.slug }}
      app_name: ${{ needs.version.outputs.app_name }}
      channel: ${{ needs.version.outputs.channel }}

  build-macos:
    name: macOS
    needs: version
    uses: ./.github/workflows/build-macos.yml
    with:
      base_build: ${{ needs.version.outputs.base_build }}
      nickname: ${{ needs.version.outputs.nickname }}
      canary: ${{ needs.version.outputs.canary }}
      version: ${{ needs.version.outputs.version }}
      slug: ${{ needs.version.outputs.slug }}
      app_name: ${{ needs.version.outputs.app_name }}
      channel: ${{ needs.version.outputs.channel }}

  manifest:
    name: Update manifest
    needs: [ version, build-windows, build-linux, build-macos ]
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build update-manifest.json
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import os

          root = pathlib.Path('artifacts')
          assets = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              name = path.name
              low = name.lower()
              if low.endswith('.sha256') or low.endswith('.msi') or name == 'update-manifest.json':
                  continue
              if low.endswith(('.dmg', '.deb', '.rpm', '.appimage', '.pkg', '.exe', '.flatpak', '.snap')):
                  continue
              if 'windows' in low:
                  target_os, arch, fmt, kind = 'windows', 'x64', 'zip', 'onedir'
              elif 'linux' in low:
                  arch = 'arm64' if ('arm64' in low or 'aarch64' in low) else 'x64'
                  fmt = 'tar.gz' if low.endswith('.tar.gz') else 'zip'
                  target_os, kind = 'linux', 'onedir'
              elif 'macos' in low:
                  arch = 'arm64' if 'arm64' in low else 'x64'
                  target_os, fmt, kind = 'macos', 'zip', 'bundle'
              else:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assets.append({
                  'os': target_os,
                  'arch': arch,
                  'name': name,
                  'format': fmt,
                  'kind': kind,
                  'sha256': digest,
                  'size': path.stat().st_size,
              })
          payload = {
              'version': '${{ needs.version.outputs.version }}',
              'tag': '${{ needs.version.outputs.tag }}',
              'assets': assets,
          }
          out = pathlib.Path('artifacts/update-manifest.json')
          out.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: artifacts/update-manifest.json
          if-no-files-found: error
          retention-days: 3

  release:
    name: GitHub Release
    needs: [ version, build-windows, build-linux, build-macos, manifest ]
    if: ${{ !cancelled() && needs.version.outputs.is_new == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Combined checksums
        run: |
          ls release-files | grep -q . || { echo "::error::No build artifacts."; exit 1; }
          mv release-files/glibc-*.txt . 2>/dev/null || true
          mv release-files/minos-*.txt . 2>/dev/null || true
          cd release-files
          sha256sum $(ls | grep -v -e '\.sha256$' -e '^SHA256SUMS.txt$') > SHA256SUMS.txt

      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ needs.version.outputs.tag }}"
          MACARM=$(cat minos-arm64.txt 2>/dev/null || true)
          MACX64=$(cat minos-x64.txt 2>/dev/null || true)
          GLIBCX64=$(cat glibc-x64.txt 2>/dev/null || true)
          GLIBCARM=$(cat glibc-arm64.txt 2>/dev/null || true)
          distros() {
            python3 - "$1" "$2" <<'PY'
          import sys
          floor = tuple(int(x) for x in sys.argv[1].split('.'))
          arch = sys.argv[2]
          releases = [
              ('Ubuntu', [('20.04', '2.31'), ('22.04', '2.35'), ('24.04', '2.39'), ('25.04', '2.41')], True),
              ('Debian', [('11', '2.31'), ('12', '2.36'), ('13', '2.41')], True),
              ('Linux Mint', [('20', '2.31'), ('21', '2.35'), ('22', '2.39')], False),
              ('Fedora', [('36', '2.35'), ('37', '2.36'), ('38', '2.37'), ('39', '2.38'), ('40', '2.39')], True),
          ]
          out = []
          for name, versions, has_arm in releases:
              if arch == 'arm64' and not has_arm:
                  continue
              for version, glibc in versions:
                  if tuple(int(x) for x in glibc.split('.')) >= floor:
                      out.append(f'{name} {version}+')
                      break
          print(', '.join(out) or 'a current distribution')
          PY
          }
          DISTROSX64=$(distros "$GLIBCX64" x64)
          DISTROSARM=$(distros "$GLIBCARM" arm64)
          PREV=$(gh api "repos/$REPO/releases?per_page=1" --jq '.[0].tag_name // empty')
          NOTES_SHA="${{ github.sha }}"
          PARENTS=$(gh api "repos/$REPO/commits/$NOTES_SHA" --jq '.parents | length')
          if [ "$PARENTS" -gt 1 ]; then
            REAL=$(gh api "repos/$REPO/commits?sha=$NOTES_SHA&per_page=30" \
              --jq '[.[] | select((.parents | length) == 1)][0].sha // empty')
            [ -n "$REAL" ] && NOTES_SHA="$REAL"
          fi
          FULL=$(gh api "repos/$REPO/commits/$NOTES_SHA" --jq '.commit.message' | tr -d '\r')
          MSG=$(printf '%s\n' "$FULL" | sed '1,/^$/d' | sed '1{/^#[[:space:]]/d}' | sed '/./,$!d')
          [ -z "$MSG" ] && MSG=$(printf '%s\n' "$FULL" | sed '1{/^#[[:space:]]/d}' | sed '/./,$!d')
          [ -z "$MSG" ] && MSG="${{ needs.version.outputs.app_name }} ${{ needs.version.outputs.display }}."
          SLUG="${{ needs.version.outputs.slug }}"
          APP="${{ needs.version.outputs.app_name }}"
          BASE="https://github.com/$REPO/releases/download/$TAG/$SLUG-${{ needs.version.outputs.base_build }}"
          {
            printf '%s\n\n' "$MSG"
            cat <<'EOF'
          <!-- downloads -->
          ## Downloads

          | Platform | Architecture | Download |
          | --- | --- | --- |
          | **Windows** | x64 | [Installer (.msi)](@@BASE@@-Windows-x64.msi) · [Portable (.zip)](@@BASE@@-Windows-x64.zip) |
          | **macOS** | Apple Silicon (arm64) | [Disk image (.dmg)](@@BASE@@-macOS-arm64.dmg) · [Archive (.zip)](@@BASE@@-macOS-arm64.zip) |
          | **macOS** | Intel (x64) | [Disk image (.dmg)](@@BASE@@-macOS-x64.dmg) · [Archive (.zip)](@@BASE@@-macOS-x64.zip) |
          | **Linux** | x64 | [Package (.deb)](@@BASE@@-Linux-x64.deb) · [AppImage](@@BASE@@-Linux-x64.AppImage) · [Archive (.tar.gz)](@@BASE@@-Linux-x64.tar.gz) |
          | **Linux** | arm64 | [Package (.deb)](@@BASE@@-Linux-arm64.deb) · [AppImage](@@BASE@@-Linux-arm64.AppImage) · [Archive (.tar.gz)](@@BASE@@-Linux-arm64.tar.gz) |

          ## Installation

          **Windows**

          - **Installer:** run the MSI and choose an install location in the setup wizard. It installs for the current user with a Start Menu shortcut, with no admin prompt and no forced file associations.
          - **Portable:** extract the ZIP and run `@@APP@@.exe`.

          **macOS**

          - **Disk image:** open the DMG and drag `@@APP@@.app` onto the Applications shortcut.
          - **Archive:** extract the ZIP and move `@@APP@@.app` to your Applications folder.
          - The builds are ad-hoc signed, not notarized. On first launch, if macOS blocks the app, right-click it and choose **Open**, or allow it in **System Settings → Privacy & Security**.

          **Linux**

          - **Debian/Ubuntu:** install with `sudo apt install ./@@BASE@@-Linux-x64.deb`, then launch `pirachest` from your app menu.
          - **AppImage:** make it executable with `chmod +x` and run it. If it will not start because FUSE is missing, run it with `--appimage-extract-and-run`.
          - **Archive:** extract the archive and run the `@@APP@@` executable inside the extracted folder.
          - Package installs update through the package manager, portable archives update themselves in-app, and AppImages are updated by downloading the new file.

          ## System requirements

          | Platform | Requirements |
          | --- | --- |
          | **Windows** | Windows 10 (version 1809 or newer) or Windows 11, 64-bit (Intel or AMD) |
          | **macOS (Apple Silicon)** | macOS @@MACARM@@ or newer |
          | **macOS (Intel)** | macOS @@MACX64@@ or newer |
          | **Linux** | x64 with glibc @@GLIBCX64@@ or newer (@@DISTROSX64@@); arm64 with glibc @@GLIBCARM@@ or newer (@@DISTROSARM@@). The `.deb` pulls in the required Qt/X11 libraries; archive and AppImage users need `libegl1`, `libgl1`, `libxkbcommon-x11-0`, `libxcb-cursor0`, `libxcb-icccm4`, `libxcb-image0`, `libxcb-keysyms1`, `libxcb-render-util0`, `libxcb-shape0`, `libxcb-xkb1`, `libdbus-1-3` and `libpulse0`. |

          <details>
          <summary>Checksums and auto-updates</summary>

          Every download has a matching `.sha256` file. The built-in updater reads `update-manifest.json`, which lists each asset with its operating system, architecture, format and SHA-256 checksum, then picks only the build that matches your OS and CPU. Downloads fall back to the GitLab and SourceForge mirrors when GitHub is unavailable.

          </details>
          EOF
            if [ -n "$PREV" ]; then
              printf '\n**Full Changelog:** https://github.com/%s/compare/%s...%s\n' "$REPO" "$PREV" "$TAG"
            fi
          } | sed -e "s|@@BASE@@|$BASE|g" -e "s|@@APP@@|$APP|g" -e "s|@@MACARM@@|$MACARM|g" -e "s|@@MACX64@@|$MACX64|g" \
            -e "s|@@GLIBCX64@@|$GLIBCX64|g" -e "s|@@GLIBCARM@@|$GLIBCARM|g" \
            -e "s|@@DISTROSX64@@|$DISTROSX64|g" -e "s|@@DISTROSARM@@|$DISTROSARM|g" > notes.md
          [ -n "$MACARM" ] || sed -i -e '/macOS-arm64/d' -e '/macOS (Apple Silicon)/d' notes.md
          [ -n "$MACX64" ] || sed -i -e '/macOS-x64/d' -e '/macOS (Intel)/d' notes.md
          for p in Windows-x64 Linux-x64 Linux-arm64; do
            ls release-files/*-$p.* >/dev/null 2>&1 || sed -i "/$p/d" notes.md
          done
          [ -n "$GLIBCX64$GLIBCARM" ] || sed -i '/^| \*\*Linux\*\* | x64 with glibc/d' notes.md
          ls release-files/*-Windows-x64.* >/dev/null 2>&1 || sed -i '/Windows 10 (version/d' notes.md

      - id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "${{ needs.version.outputs.app_name }} ${{ needs.version.outputs.display }}"
          body_path: notes.md
          generate_release_notes: false
          prerelease: ${{ needs.version.outputs.canary == '1' }}
          make_latest: ${{ needs.version.outputs.canary != '1' }}
          fail_on_unmatched_files: true
          files: release-files/*

      - name: Summary
        run: |
          {
            echo "### Released [${{ needs.version.outputs.tag }}](${{ steps.release.outputs.url }})"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in release-files/*; do
              printf '| %s | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
