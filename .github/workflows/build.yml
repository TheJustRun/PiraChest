name: Build PiraChest (Windows, Linux, macOS)

on:
  workflow_call:
    outputs:
      tag:
        description: "Git tag of this version"
        value: ${{ jobs.version.outputs.tag }}
      is_new:
        description: "'true' when a new GitHub release was created"
        value: ${{ jobs.version.outputs.is_new }}
      canary:
        description: "'1' for canary builds"
        value: ${{ jobs.version.outputs.canary }}
      display:
        description: "Human readable version"
        value: ${{ jobs.version.outputs.display }}
      app_name:
        description: "Application name"
        value: ${{ jobs.version.outputs.app_name }}
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.ver.outputs.base }}
      build: ${{ steps.ver.outputs.build }}
      base_build: ${{ steps.ver.outputs.base_build }}
      nickname: ${{ steps.ver.outputs.nickname }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      is_new: ${{ steps.ver.outputs.is_new }}
      canary: ${{ steps.ver.outputs.canary }}
      channel: ${{ steps.ver.outputs.channel }}
      slug: ${{ steps.ver.outputs.slug }}
      display: ${{ steps.ver.outputs.display }}
      app_name: ${{ steps.ver.outputs.app_name }}
    steps:
      - uses: actions/checkout@v5
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re

          lines = [line.strip() for line in open('VERSION', encoding='utf-8').read().splitlines() if line.strip()]
          if not lines:
              raise SystemExit('VERSION is empty')
          first = lines[0]
          match = re.match(r'(\d+\.\d+\.\d+)(?:[.-](\d+))?', first)
          if not match:
              raise SystemExit(f'Invalid VERSION: must start with X.Y.Z (got: {first})')
          base = match.group(1)
          build = match.group(2) or ''
          build_part = f'-{build}' if build else ''
          legacy = re.search(r'\(([^)]+)\)', first)
          nickname = legacy.group(1).strip() if legacy else ''
          canary = bool(re.search(r'(?:^|[-_.])canary(?:$|[-_.\s])', first, re.I))
          for line in lines[1:]:
              key, sep, value = line.partition('=')
              name = key.strip().lower()
              if sep and name in ('canary', 'is_canary'):
                  canary = value.strip().lower() in ('1', 'true', 'yes', 'on')
              elif sep and name in ('nickname', 'name'):
                  nickname = value.strip()
              elif line in ('0', '1'):
                  canary = line == '1'
              elif not nickname:
                  nickname = line
          nick_slug = re.sub(r'[^a-z0-9]+', '-', nickname.lower()).strip('-')
          channel = 'canary' if canary else 'stable'
          version = f'{base}-{channel}{build_part}' + (f'-{nick_slug}' if nick_slug else '')
          display = f'{base}-{channel}{build_part}' + (f' ({nickname})' if nickname else '')
          print(f'base={base}')
          print(f'build={build}')
          print(f'base_build={base}{build_part}')
          print(f'nickname={nickname}')
          print(f'version={version}')
          print(f'display={display}')
          print(f'tag=v{version}')
          print(f'canary={1 if canary else 0}')
          print(f'channel={channel}')
          print(f'slug={"PiraChest-Canary" if canary else "PiraChest"}')
          print(f'app_name={"PiraChest Canary" if canary else "PiraChest"}')
          PY
          TAG=$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -n1)
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: PyInstaller (Windows x64, onedir)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Write version file
        shell: pwsh
        env:
          VERSION_BASE: ${{ needs.version.outputs.base_build }}
          VERSION_NICK: ${{ needs.version.outputs.nickname }}
          VERSION_CANARY: ${{ needs.version.outputs.canary }}
        run: |
          Set-Content -Path VERSION -Value @($env:VERSION_BASE, $env:VERSION_NICK, $env:VERSION_CANARY)

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2 2>$null
          if ($LASTEXITCODE -ne 0) { dotnet tool update --global wix --version 5.0.2 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build with PyInstaller
        shell: cmd
        env:
          SKIP_MSI: "1"
        run: build.bat

      - name: Build MSI installer
        shell: pwsh
        run: |
          $slug = "${{ needs.version.outputs.slug }}"
          $brand = "${{ needs.version.outputs.app_name }}"
          $exeName = "$brand.exe"
          $distDir = "dist/$slug"
          if (-not (Test-Path "$distDir/$exeName")) { Write-Error "Build output missing"; exit 1 }
          if (Test-Path "$distDir/data") { Remove-Item "$distDir/data" -Recurse -Force }
          New-Item -ItemType Directory -Force package | Out-Null
          $ver = ("${{ needs.version.outputs.version }}" -split '-')[0]
          $exe = (Resolve-Path "$distDir/$exeName").Path
          $srcDir = (Resolve-Path $distDir).Path
          $canary = "${{ needs.version.outputs.canary }}" -eq "1"
          $ico = if ($canary -and (Test-Path 'src/gui/photos/icon_c.ico')) { (Resolve-Path 'src/gui/photos/icon_c.ico').Path } elseif (Test-Path 'src/gui/photos/icon.ico') { (Resolve-Path 'src/gui/photos/icon.ico').Path } else { Get-ChildItem -Recurse -File -Filter *.ico | Where-Object { $_.FullName -notmatch '[\\/](dist|build|package|\.venv|venv|node_modules|site-packages)[\\/]' } | Sort-Object Length -Descending | Select-Object -First 1 -ExpandProperty FullName }
          $iconSrc = if ($ico) { $ico } else { $exe }
          Add-Type -AssemblyName System.Drawing
          $png = Join-Path $env:GITHUB_WORKSPACE "package/$slug-icon.png"
          try {
            $icon = if ($ico) { [System.Drawing.Icon]::new($ico, 256, 256) } else { [System.Drawing.Icon]::ExtractAssociatedIcon($exe) }
            $icon.ToBitmap().Save($png, [System.Drawing.Imaging.ImageFormat]::Png)
          } catch {
            [System.Drawing.Icon]::ExtractAssociatedIcon($exe).ToBitmap().Save($png, [System.Drawing.Imaging.ImageFormat]::Png)
          }
          $assets = Join-Path $env:GITHUB_WORKSPACE 'installer/assets'
          $dlgBmp = Join-Path $assets 'dialog.bmp'
          $banBmp = Join-Path $assets 'banner.bmp'
          if ($canary) {
            if (Test-Path (Join-Path $assets 'dialog_c.bmp')) { $dlgBmp = Join-Path $assets 'dialog_c.bmp' }
            if (Test-Path (Join-Path $assets 'banner_c.bmp')) { $banBmp = Join-Path $assets 'banner_c.bmp' }
          }
          foreach ($b in @($dlgBmp, $banBmp)) {
            if (-not (Test-Path $b)) { Write-Error "Missing installer art: $b"; exit 1 }
          }
          $msiName = "$slug-${{ needs.version.outputs.base_build }}-Windows-x64.msi"
          $msi = Join-Path $env:GITHUB_WORKSPACE "package/$msiName"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $upgrade = if ($canary) { 'b7e0d3f2-9c41-4e8a-a6d5-2f7c1e9b4a68' } else { 'a3f6c2d1-7b4e-4c9a-8f2d-5e1b0c7a9d34' }
          wix build installer/PiraChest.wxs -arch x64 -pdbtype none -ext WixToolset.UI.wixext `
            -d Version=$ver -d SourceDir="$srcDir" -d IconFile="$iconSrc" -d DialogBmp="$dlgBmp" -d BannerBmp="$banBmp" `
            -d Brand="$brand" -d ExeName="$exeName" -d UpgradeCode="$upgrade" `
            -d Manufacturer="${{ github.repository_owner }}" -d ProjectUrl="https://github.com/${{ github.repository }}" `
            -o "$msi"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "MSI_PATH=$msi" >> $env:GITHUB_ENV

      - name: Zip + checksums
        shell: pwsh
        run: |
          $slug = "${{ needs.version.outputs.slug }}"
          $name = "$slug-${{ needs.version.outputs.base_build }}-Windows-x64.zip"
          $out = Join-Path $env:GITHUB_WORKSPACE "package/$name"
          Push-Location "dist/$slug"
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip -mx=9 -mmt=on "$out" * | Out-Null
          } else {
            Compress-Archive -Path * -DestinationPath $out -CompressionLevel Optimal
          }
          Pop-Location
          foreach ($f in @($out, $env:MSI_PATH)) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)" | Set-Content "$f.sha256" -Encoding utf8NoBOM
          }
          $mb = [math]::Round((Get-ChildItem "dist/$slug" -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)
          "Onedir size: $mb MB" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: package/*
          if-no-files-found: error
          retention-days: 3

  build-linux:
    name: PyInstaller (Linux ${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            glibc: "2.35"
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            glibc: "2.39"
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Write version file
        shell: bash
        env:
          VERSION_BASE: ${{ needs.version.outputs.base_build }}
          VERSION_NICK: ${{ needs.version.outputs.nickname }}
          VERSION_CANARY: ${{ needs.version.outputs.canary }}
        run: |
          printf '%s\n%s\n%s\n' "$VERSION_BASE" "$VERSION_NICK" "$VERSION_CANARY" > VERSION

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 zstd
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.2 pyinstaller-hooks-contrib==2026.9

      - name: Build with PyInstaller
        env:
          SKIP_MSI: "1"
        run: python -m PyInstaller --noconfirm PiraChest.spec

      - name: Verify glibc floor
        env:
          LIMIT: ${{ matrix.glibc }}
        run: |
          max=$(find dist -type f \( -name '*.so*' -o -perm -u+x \) -print0 \
            | xargs -0 -r objdump -T 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -n1)
          echo "Highest glibc symbol required: ${max:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$max" ] && [ "$(printf '%s\n%s\n' "$max" "$LIMIT" | sort -V | tail -n1)" != "$LIMIT" ]; then
            echo "::error::Linux build needs glibc $max, above the $LIMIT limit."
            exit 1
          fi

      - name: Package + checksum
        shell: bash
        run: |
          slug="${{ needs.version.outputs.slug }}"
          app="${{ needs.version.outputs.app_name }}"
          base="${{ needs.version.outputs.base_build }}"
          channel="${{ needs.version.outputs.channel }}"
          name="$slug-$base-Linux-${{ matrix.arch }}.tar.gz"
          mkdir -p package
          tar -czf "package/$name" -C dist "$slug"

          pkg="build/deb"
          pkgname=$(printf '%s' "$slug" | tr '[:upper:]' '[:lower:]')
          rm -rf "$pkg"
          mkdir -p "$pkg/DEBIAN" "$pkg/opt/$pkgname" \
                   "$pkg/usr/bin" "$pkg/usr/share/applications" \
                   "$pkg/usr/share/icons/hicolor/256x256/apps"
          cp -a "dist/$slug/." "$pkg/opt/$pkgname/"
          ln -sf "/opt/$pkgname/$app" "$pkg/usr/bin/$pkgname"
          icon="src/gui/photos/icon.ico"
          [ "${{ needs.version.outputs.canary }}" = "1" ] && [ -f src/gui/photos/icon_c.ico ] && icon="src/gui/photos/icon_c.ico"
          python - "$pkg/usr/share/icons/hicolor/256x256/apps/$pkgname.png" "$icon" <<'PY'
          import sys
          sys.path.insert(0, '.')
          from tools.make_icns import build_png

          if not build_png(sys.argv[1], sys.argv[2]):
              raise SystemExit('Could not read application icon')
          PY
          cat > "$pkg/usr/share/applications/$pkgname.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=$app
          Comment=Stream, download and organize your media
          Exec="/opt/$pkgname/$app" %U
          Icon=$pkgname
          Terminal=false
          Categories=AudioVideo;Network;Utility;
          StartupNotify=true
          StartupWMClass=$app
          EOF
          debarch=${{ matrix.arch }}
          [ "$debarch" = "x64" ] && debarch=amd64
          size=$(du -sk "$pkg" | cut -f1)
          debver="$base"
          [ "$channel" = "canary" ] && debver="$base~canary"
          cat > "$pkg/DEBIAN/control" <<EOF
          Package: $pkgname
          Version: $debver
          Architecture: $debarch
          Installed-Size: $size
          Maintainer: JustRun <noreply@github.com>
          Section: video
          Priority: optional
          Depends: libc6 (>= ${{ matrix.glibc }}), libegl1, libgl1, libxkbcommon-x11-0, libxcb-cursor0, libxcb-icccm4, libxcb-image0, libxcb-keysyms1, libxcb-render-util0, libxcb-shape0, libxcb-xkb1, libdbus-1-3, libpulse0
          Description: $app
           Stream, download and organize movies, shows, music, torrents and YouTube media.
          Homepage: https://github.com/${{ github.repository }}
          EOF
          debname="$slug-$base-Linux-${{ matrix.arch }}.deb"
          dpkg-deb --build --root-owner-group "$pkg" "package/$debname"

          appdir="build/AppDir"
          rm -rf "$appdir"
          mkdir -p "$appdir"
          cp -al "dist/$slug" "$appdir/app"
          cp "$pkg/usr/share/icons/hicolor/256x256/apps/$pkgname.png" "$appdir/$pkgname.png"
          sed 's|^Exec=.*|Exec=AppRun %U|' "$pkg/usr/share/applications/$pkgname.desktop" > "$appdir/$pkgname.desktop"
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/app/%s" "$@"\n' "$app" > "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          curl -fsSL --retry 3 -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.machine }}.AppImage"
          chmod +x appimagetool
          ARCH=${{ matrix.machine }} ./appimagetool --appimage-extract-and-run --no-appstream \
            "$appdir" "package/$slug-$base-Linux-${{ matrix.arch }}.AppImage"

          cd package
          for f in *.tar.gz *.deb *.AppImage; do
            sha256sum "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-package
          path: package/*
          if-no-files-found: error
          retention-days: 3

      - name: Record glibc floor for the release notes
        run: echo "${{ matrix.glibc }}" > "glibc-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-glibc
          path: glibc-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 3

  build-macos:
    name: PyInstaller (macOS ${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: "14.0"
            machine: arm64
            floor: "14.0"
          - arch: x64
            runner: macos-15-intel
            target: "15.0"
            machine: x86_64
            floor: "15.0"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    continue-on-error: true
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Write version file
        shell: bash
        env:
          VERSION_BASE: ${{ needs.version.outputs.base_build }}
          VERSION_NICK: ${{ needs.version.outputs.nickname }}
          VERSION_CANARY: ${{ needs.version.outputs.canary }}
        run: |
          printf '%s\n%s\n%s\n' "$VERSION_BASE" "$VERSION_NICK" "$VERSION_CANARY" > VERSION

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            python -m pip download --no-deps --only-binary=:all: \
              --python-version 3.13 --implementation cp --abi cp313 \
              --platform macosx_14_0_arm64 -d lowfloor \
              libtorrent==2.1.1 orjson==3.13.0
            python -m pip install lowfloor/*.whl
          fi
          python -m pip install -r requirements.txt pyinstaller==6.22.2 pyinstaller-hooks-contrib==2026.9

      - name: Build with PyInstaller
        env:
          SKIP_MSI: "1"
        run: python -m PyInstaller --noconfirm PiraChest.spec

      - name: Measure and set minimum macOS version
        env:
          MACHINE: ${{ matrix.machine }}
          LIMIT: ${{ matrix.floor }}
        run: |
          app="dist/${{ needs.version.outputs.app_name }}.app"
          floor=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            read -r v sdk < <(otool -arch "$MACHINE" -l "$f" 2>/dev/null \
              | awk '$1=="minos"{mv=$2} $1=="sdk"{sv=$2} $1=="cmd"&&$2=="LC_VERSION_MIN_MACOSX"{m=1} m&&$1=="version"{mv=$2} m&&$1=="sdk"{sv=$2; m=0} END{print mv, sv}')
            [ -n "$v" ] || continue
            if [ "$(printf '%s\n%s\n' "$v" "$LIMIT" | sort -V | tail -n1)" != "$LIMIT" ]; then
              echo "::warning::${f#$app/} declares minos $v; lowering to $LIMIT"
              mode=$(stat -f %Lp "$f")
              vtool -set-build-version macos "$LIMIT" "${sdk:-$LIMIT}" -replace -output "$f.patched" "$f"
              mv "$f.patched" "$f"
              chmod "$mode" "$f"
              v="$LIMIT"
            fi
            [ "$(printf '%s\n%s\n' "$v" "$floor" | sort -V | tail -n1)" = "$v" ] && floor="$v"
          done < <(find "$app" -type f \( -name '*.so' -o -name '*.dylib' -o -perm -u+x \) -print0)
          [ "$floor" != "0" ] || { echo "::error::Could not measure the macOS minimum version."; exit 1; }
          plist="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :LSMinimumSystemVersion" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string $floor" "$plist"
          echo "$floor" > "minos-${{ matrix.arch }}.txt"
          echo "macOS ${{ matrix.arch }} minimum version: $floor" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Package + checksum
        shell: bash
        run: |
          slug="${{ needs.version.outputs.slug }}"
          app="${{ needs.version.outputs.app_name }}.app"
          base="${{ needs.version.outputs.base_build }}"
          mkdir -p package
          codesign --force --deep --sign - "dist/$app"
          name="$slug-$base-macOS-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/$app" "package/$name"
          rm -rf build/dmg
          mkdir -p build/dmg
          cp -R "dist/$app" "build/dmg/$app"
          ln -s /Applications build/dmg/Applications
          dmg="$slug-$base-macOS-${{ matrix.arch }}.dmg"
          hdiutil create -quiet -volname "${{ needs.version.outputs.app_name }}" \
            -srcfolder build/dmg -ov -format UDZO "package/$dmg"
          cd package
          for f in *.zip *.dmg; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-package
          path: package/*
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-minos
          path: minos-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 3

  manifest:
    name: Update manifest
    needs: [ version, build-windows, build-linux, build-macos ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build update-manifest.json
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import os

          root = pathlib.Path('artifacts')
          assets = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              name = path.name
              low = name.lower()
              if low.endswith('.sha256') or low.endswith('.msi') or name == 'update-manifest.json':
                  continue
              if low.endswith(('.dmg', '.deb', '.rpm', '.appimage', '.pkg', '.exe', '.flatpak', '.snap')):
                  continue
              if 'windows' in low:
                  target_os, arch, fmt, kind = 'windows', 'x64', 'zip', 'onedir'
              elif 'linux' in low:
                  arch = 'arm64' if ('arm64' in low or 'aarch64' in low) else 'x64'
                  fmt = 'tar.gz' if low.endswith('.tar.gz') else 'zip'
                  target_os, kind = 'linux', 'onedir'
              elif 'macos' in low:
                  arch = 'arm64' if 'arm64' in low else 'x64'
                  target_os, fmt, kind = 'macos', 'zip', 'bundle'
              else:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assets.append({
                  'os': target_os,
                  'arch': arch,
                  'name': name,
                  'format': fmt,
                  'kind': kind,
                  'sha256': digest,
                  'size': path.stat().st_size,
              })
          payload = {
              'version': '${{ needs.version.outputs.version }}',
              'tag': '${{ needs.version.outputs.tag }}',
              'assets': assets,
          }
          out = pathlib.Path('artifacts/update-manifest.json')
          out.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: artifacts/update-manifest.json
          if-no-files-found: error
          retention-days: 3

  release:
    name: GitHub Release
    needs: [ version, build-windows, build-linux, build-macos, manifest ]
    if: needs.version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Combined checksums
        run: |
          mv release-files/glibc-*.txt .
          mv release-files/minos-*.txt . 2>/dev/null || true
          cd release-files
          sha256sum $(ls | grep -v -e '\.sha256$' -e '^SHA256SUMS.txt$') > SHA256SUMS.txt

      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ needs.version.outputs.tag }}"
          MACARM=$(cat minos-arm64.txt 2>/dev/null || true)
          MACX64=$(cat minos-x64.txt 2>/dev/null || true)
          GLIBCX64=$(cat glibc-x64.txt)
          GLIBCARM=$(cat glibc-arm64.txt)
          distros() {
            python3 - "$1" "$2" <<'PY'
          import sys
          floor = tuple(int(x) for x in sys.argv[1].split('.'))
          arch = sys.argv[2]
          releases = [
              ('Ubuntu', [('20.04', '2.31'), ('22.04', '2.35'), ('24.04', '2.39'), ('25.04', '2.41')], True),
              ('Debian', [('11', '2.31'), ('12', '2.36'), ('13', '2.41')], True),
              ('Linux Mint', [('20', '2.31'), ('21', '2.35'), ('22', '2.39')], False),
              ('Fedora', [('36', '2.35'), ('37', '2.36'), ('38', '2.37'), ('39', '2.38'), ('40', '2.39')], True),
          ]
          out = []
          for name, versions, has_arm in releases:
              if arch == 'arm64' and not has_arm:
                  continue
              for version, glibc in versions:
                  if tuple(int(x) for x in glibc.split('.')) >= floor:
                      out.append(f'{name} {version}+')
                      break
          print(', '.join(out) or 'a current distribution')
          PY
          }
          DISTROSX64=$(distros "$GLIBCX64" x64)
          DISTROSARM=$(distros "$GLIBCARM" arm64)
          PREV=$(gh api "repos/$REPO/releases?per_page=1" --jq '.[0].tag_name // empty')
          NOTES_SHA="${{ github.sha }}"
          PARENTS=$(gh api "repos/$REPO/commits/$NOTES_SHA" --jq '.parents | length')
          if [ "$PARENTS" -gt 1 ]; then
            REAL=$(gh api "repos/$REPO/commits?sha=$NOTES_SHA&per_page=30" \
              --jq '[.[] | select((.parents | length) == 1)][0].sha // empty')
            [ -n "$REAL" ] && NOTES_SHA="$REAL"
          fi
          FULL=$(gh api "repos/$REPO/commits/$NOTES_SHA" --jq '.commit.message' | tr -d '\r')
          MSG=$(printf '%s\n' "$FULL" | sed '1,/^$/d' | sed '1{/^#[[:space:]]/d}' | sed '/./,$!d')
          [ -z "$MSG" ] && MSG=$(printf '%s\n' "$FULL" | sed '1{/^#[[:space:]]/d}' | sed '/./,$!d')
          [ -z "$MSG" ] && MSG="${{ needs.version.outputs.app_name }} ${{ needs.version.outputs.display }}."
          SLUG="${{ needs.version.outputs.slug }}"
          APP="${{ needs.version.outputs.app_name }}"
          BASE="https://github.com/$REPO/releases/download/$TAG/$SLUG-${{ needs.version.outputs.base_build }}"
          {
            printf '%s\n\n' "$MSG"
            cat <<'EOF'
          <!-- downloads -->
          ## Downloads

          | Platform | Architecture | Download |
          | --- | --- | --- |
          | **Windows** | x64 | [Installer (.msi)](@@BASE@@-Windows-x64.msi) · [Portable (.zip)](@@BASE@@-Windows-x64.zip) |
          | **macOS** | Apple Silicon (arm64) | [Disk image (.dmg)](@@BASE@@-macOS-arm64.dmg) · [Archive (.zip)](@@BASE@@-macOS-arm64.zip) |
          | **macOS** | Intel (x64) | [Disk image (.dmg)](@@BASE@@-macOS-x64.dmg) · [Archive (.zip)](@@BASE@@-macOS-x64.zip) |
          | **Linux** | x64 | [Package (.deb)](@@BASE@@-Linux-x64.deb) · [AppImage](@@BASE@@-Linux-x64.AppImage) · [Archive (.tar.gz)](@@BASE@@-Linux-x64.tar.gz) |
          | **Linux** | arm64 | [Package (.deb)](@@BASE@@-Linux-arm64.deb) · [AppImage](@@BASE@@-Linux-arm64.AppImage) · [Archive (.tar.gz)](@@BASE@@-Linux-arm64.tar.gz) |

          ## Installation

          **Windows**

          - **Installer:** run the MSI and choose an install location in the setup wizard. It installs for the current user with a Start Menu shortcut, with no admin prompt and no forced file associations.
          - **Portable:** extract the ZIP and run `@@APP@@.exe`.

          **macOS**

          - **Disk image:** open the DMG and drag `@@APP@@.app` onto the Applications shortcut.
          - **Archive:** extract the ZIP and move `@@APP@@.app` to your Applications folder.
          - The builds are ad-hoc signed, not notarized. On first launch, if macOS blocks the app, right-click it and choose **Open**, or allow it in **System Settings → Privacy & Security**.

          **Linux**

          - **Debian/Ubuntu:** install with `sudo apt install ./@@BASE@@-Linux-x64.deb`, then launch `pirachest` from your app menu.
          - **AppImage:** make it executable with `chmod +x` and run it. If it will not start because FUSE is missing, run it with `--appimage-extract-and-run`.
          - **Archive:** extract the archive and run the `@@APP@@` executable inside the extracted folder.
          - Package installs update through the package manager, portable archives update themselves in-app, and AppImages are updated by downloading the new file.

          ## System requirements

          | Platform | Requirements |
          | --- | --- |
          | **Windows** | Windows 10 (version 1809 or newer) or Windows 11, 64-bit (Intel or AMD) |
          | **macOS (Apple Silicon)** | macOS @@MACARM@@ or newer |
          | **macOS (Intel)** | macOS @@MACX64@@ or newer |
          | **Linux** | x64 with glibc @@GLIBCX64@@ or newer (@@DISTROSX64@@); arm64 with glibc @@GLIBCARM@@ or newer (@@DISTROSARM@@). The `.deb` pulls in the required Qt/X11 libraries; archive and AppImage users need `libegl1`, `libgl1`, `libxkbcommon-x11-0`, `libxcb-cursor0`, `libxcb-icccm4`, `libxcb-image0`, `libxcb-keysyms1`, `libxcb-render-util0`, `libxcb-shape0`, `libxcb-xkb1`, `libdbus-1-3` and `libpulse0`. |

          <details>
          <summary>Checksums and auto-updates</summary>

          Every download has a matching `.sha256` file. The built-in updater reads `update-manifest.json`, which lists each asset with its operating system, architecture, format and SHA-256 checksum, then picks only the build that matches your OS and CPU. Downloads fall back to the GitLab and SourceForge mirrors when GitHub is unavailable.

          </details>
          EOF
            if [ -n "$PREV" ]; then
              printf '\n**Full Changelog:** https://github.com/%s/compare/%s...%s\n' "$REPO" "$PREV" "$TAG"
            fi
          } | sed -e "s|@@BASE@@|$BASE|g" -e "s|@@APP@@|$APP|g" -e "s|@@MACARM@@|$MACARM|g" -e "s|@@MACX64@@|$MACX64|g" \
            -e "s|@@GLIBCX64@@|$GLIBCX64|g" -e "s|@@GLIBCARM@@|$GLIBCARM|g" \
            -e "s|@@DISTROSX64@@|$DISTROSX64|g" -e "s|@@DISTROSARM@@|$DISTROSARM|g" > notes.md
          [ -n "$MACARM" ] || sed -i -e '/macOS-arm64/d' -e '/macOS (Apple Silicon)/d' notes.md
          [ -n "$MACX64" ] || sed -i -e '/macOS-x64/d' -e '/macOS (Intel)/d' notes.md

      - id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "${{ needs.version.outputs.app_name }} ${{ needs.version.outputs.display }}"
          body_path: notes.md
          generate_release_notes: false
          prerelease: ${{ needs.version.outputs.canary == '1' }}
          make_latest: ${{ needs.version.outputs.canary != '1' }}
          fail_on_unmatched_files: true
          files: release-files/*

      - name: Summary
        run: |
          {
            echo "### Released [${{ needs.version.outputs.tag }}](${{ steps.release.outputs.url }})"
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in release-files/*; do
              printf '| %s | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
