name: Build PiraChest (Windows, Linux, macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.ver.outputs.base }}
      nickname: ${{ steps.ver.outputs.nickname }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      is_new: ${{ steps.ver.outputs.is_new }}
      canary: ${{ steps.ver.outputs.canary }}
      slug: ${{ steps.ver.outputs.slug }}
      display: ${{ steps.ver.outputs.display }}
      app_name: ${{ steps.ver.outputs.app_name }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re

          lines = [line.strip() for line in open('VERSION', encoding='utf-8').read().splitlines() if line.strip()]
          if not lines:
              raise SystemExit('VERSION is empty')
          first = lines[0]
          match = re.match(r'(\d+\.\d+\.\d+)', first)
          if not match:
              raise SystemExit(f'Invalid VERSION: must start with X.Y.Z (got: {first})')
          base = match.group(1)
          legacy = re.search(r'\(([^)]+)\)', first)
          nickname = legacy.group(1).strip() if legacy else ''
          canary = bool(re.search(r'(?:^|[-_.])canary(?:$|[-_.\s])', first, re.I))
          for line in lines[1:]:
              key, sep, value = line.partition('=')
              name = key.strip().lower()
              if sep and name in ('canary', 'is_canary'):
                  canary = value.strip().lower() in ('1', 'true', 'yes', 'on')
              elif sep and name in ('nickname', 'name'):
                  nickname = value.strip()
              elif line in ('0', '1'):
                  canary = line == '1'
              elif not nickname:
                  nickname = line
          nick_slug = re.sub(r'[^a-z0-9]+', '-', nickname.lower()).strip('-')
          channel = 'canary' if canary else 'stable'
          version = f'{base}-{channel}' + (f'-{nick_slug}' if nick_slug else '')
          display = f'{base}-{channel}' + (f' ({nickname})' if nickname else '')
          print(f'base={base}')
          print(f'nickname={nickname}')
          print(f'version={version}')
          print(f'display={display}')
          print(f'tag=v{version}')
          print(f'canary={1 if canary else 0}')
          print(f'slug={"PiraChest-Canary" if canary else "PiraChest"}')
          print(f'app_name={"PiraChest Canary" if canary else "PiraChest"}')
          PY
          TAG=$(sed -n 's/^tag=//p' "$GITHUB_OUTPUT" | tail -n1)
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: PyInstaller (Windows x64, onedir)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Write version file
        shell: pwsh
        env:
          VERSION_BASE: ${{ needs.version.outputs.base }}
          VERSION_NICK: ${{ needs.version.outputs.nickname }}
          VERSION_CANARY: ${{ needs.version.outputs.canary }}
        run: |
          Set-Content -Path VERSION -Value @($env:VERSION_BASE, $env:VERSION_NICK, $env:VERSION_CANARY)

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2 2>$null
          if ($LASTEXITCODE -ne 0) { dotnet tool update --global wix --version 5.0.2 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build with PyInstaller
        shell: cmd
        env:
          SKIP_MSI: "1"
        run: build.bat

      - name: Build MSI installer
        shell: pwsh
        run: |
          $slug = "${{ needs.version.outputs.slug }}"
          $brand = "${{ needs.version.outputs.app_name }}"
          $exeName = "$brand.exe"
          $distDir = "dist/$slug"
          if (-not (Test-Path "$distDir/$exeName")) { Write-Error "Build output missing"; exit 1 }
          if (Test-Path "$distDir/data") { Remove-Item "$distDir/data" -Recurse -Force }
          New-Item -ItemType Directory -Force package | Out-Null
          $ver = ("${{ needs.version.outputs.version }}" -split '-')[0]
          $exe = (Resolve-Path "$distDir/$exeName").Path
          $srcDir = (Resolve-Path $distDir).Path
          $canary = "${{ needs.version.outputs.canary }}" -eq "1"
          $ico = if ($canary -and (Test-Path 'src/gui/photos/icon_c.ico')) { (Resolve-Path 'src/gui/photos/icon_c.ico').Path } elseif (Test-Path 'src/gui/photos/icon.ico') { (Resolve-Path 'src/gui/photos/icon.ico').Path } else { Get-ChildItem -Recurse -File -Filter *.ico | Where-Object { $_.FullName -notmatch '[\\/](dist|build|package|\.venv|venv|node_modules|site-packages)[\\/]' } | Sort-Object Length -Descending | Select-Object -First 1 -ExpandProperty FullName }
          $iconSrc = if ($ico) { $ico } else { $exe }
          Add-Type -AssemblyName System.Drawing
          $png = Join-Path $env:GITHUB_WORKSPACE "package/$slug-icon.png"
          try {
            $icon = if ($ico) { [System.Drawing.Icon]::new($ico, 256, 256) } else { [System.Drawing.Icon]::ExtractAssociatedIcon($exe) }
            $icon.ToBitmap().Save($png, [System.Drawing.Imaging.ImageFormat]::Png)
          } catch {
            [System.Drawing.Icon]::ExtractAssociatedIcon($exe).ToBitmap().Save($png, [System.Drawing.Imaging.ImageFormat]::Png)
          }
          $assets = Join-Path $env:GITHUB_WORKSPACE 'installer/assets'
          $dlgBmp = Join-Path $assets 'dialog.bmp'
          $banBmp = Join-Path $assets 'banner.bmp'
          if ($canary) {
            if (Test-Path (Join-Path $assets 'dialog_c.bmp')) { $dlgBmp = Join-Path $assets 'dialog_c.bmp' }
            if (Test-Path (Join-Path $assets 'banner_c.bmp')) { $banBmp = Join-Path $assets 'banner_c.bmp' }
          }
          foreach ($b in @($dlgBmp, $banBmp)) {
            if (-not (Test-Path $b)) { Write-Error "Missing installer art: $b"; exit 1 }
          }
          $msiName = "$slug-${{ needs.version.outputs.tag }}-Windows-x64.msi"
          $msi = Join-Path $env:GITHUB_WORKSPACE "package/$msiName"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $upgrade = if ($canary) { 'b7e0d3f2-9c41-4e8a-a6d5-2f7c1e9b4a68' } else { 'a3f6c2d1-7b4e-4c9a-8f2d-5e1b0c7a9d34' }
          wix build installer/PiraChest.wxs -arch x64 -pdbtype none -ext WixToolset.UI.wixext `
            -d Version=$ver -d SourceDir="$srcDir" -d IconFile="$iconSrc" -d DialogBmp="$dlgBmp" -d BannerBmp="$banBmp" `
            -d Brand="$brand" -d ExeName="$exeName" -d UpgradeCode="$upgrade" `
            -d Manufacturer="${{ github.repository_owner }}" -d ProjectUrl="https://github.com/${{ github.repository }}" `
            -o "$msi"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "MSI_PATH=$msi" >> $env:GITHUB_ENV

      - name: Zip + checksums
        shell: pwsh
        run: |
          $slug = "${{ needs.version.outputs.slug }}"
          $name = "$slug-${{ needs.version.outputs.tag }}-Windows-x64.zip"
          $out = Join-Path $env:GITHUB_WORKSPACE "package/$name"
          Push-Location "dist/$slug"
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip -mx=9 -mmt=on "$out" * | Out-Null
          } else {
            Compress-Archive -Path * -DestinationPath $out -CompressionLevel Optimal
          }
          Pop-Location
          foreach ($f in @($out, $env:MSI_PATH)) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)" | Set-Content "$f.sha256" -Encoding utf8NoBOM
          }
          $mb = [math]::Round((Get-ChildItem "dist/$slug" -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)
          "Onedir size: $mb MB" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: package/*
          if-no-files-found: error

  build-linux:
    name: PyInstaller (Linux ${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Write version file
        shell: bash
        env:
          VERSION_BASE: ${{ needs.version.outputs.base }}
          VERSION_NICK: ${{ needs.version.outputs.nickname }}
          VERSION_CANARY: ${{ needs.version.outputs.canary }}
        run: |
          printf '%s\n%s\n%s\n' "$VERSION_BASE" "$VERSION_NICK" "$VERSION_CANARY" > VERSION

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 zstd
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.2 pyinstaller-hooks-contrib==2026.9

      - name: Build with PyInstaller
        env:
          SKIP_MSI: "1"
        run: python -m PyInstaller --noconfirm PiraChest.spec

      - name: Package + checksum
        shell: bash
        run: |
          slug="${{ needs.version.outputs.slug }}"
          name="$slug-${{ needs.version.outputs.tag }}-Linux-${{ matrix.arch }}.tar.gz"
          mkdir -p package
          tar -czf "package/$name" -C dist "$slug"
          cd package
          sha256sum "$name" > "$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-package
          path: package/*
          if-no-files-found: error

  build-macos:
    name: PyInstaller (macOS ${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Write version file
        shell: bash
        env:
          VERSION_BASE: ${{ needs.version.outputs.base }}
          VERSION_NICK: ${{ needs.version.outputs.nickname }}
          VERSION_CANARY: ${{ needs.version.outputs.canary }}
        run: |
          printf '%s\n%s\n%s\n' "$VERSION_BASE" "$VERSION_NICK" "$VERSION_CANARY" > VERSION

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.2 pyinstaller-hooks-contrib==2026.9

      - name: Build with PyInstaller
        env:
          SKIP_MSI: "1"
        run: python -m PyInstaller --noconfirm PiraChest.spec

      - name: Package + checksum
        shell: bash
        run: |
          slug="${{ needs.version.outputs.slug }}"
          app="${{ needs.version.outputs.app_name }}.app"
          name="$slug-${{ needs.version.outputs.tag }}-macOS-${{ matrix.arch }}.zip"
          mkdir -p package
          ditto -c -k --sequesterRsrc --keepParent "dist/$app" "package/$name"
          cd package
          shasum -a 256 "$name" > "$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-package
          path: package/*
          if-no-files-found: error

  manifest:
    name: Update manifest
    needs: [ version, build-windows, build-linux, build-macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build update-manifest.json
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import os

          root = pathlib.Path('artifacts')
          assets = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              name = path.name
              low = name.lower()
              if low.endswith('.sha256') or low.endswith('.msi') or name == 'update-manifest.json':
                  continue
              if 'windows' in low:
                  target_os, arch, fmt, kind = 'windows', 'x64', 'zip', 'onedir'
              elif 'linux' in low:
                  arch = 'arm64' if ('arm64' in low or 'aarch64' in low) else 'x64'
                  fmt = 'tar.gz' if low.endswith('.tar.gz') else 'zip'
                  target_os, kind = 'linux', 'onedir'
              elif 'macos' in low:
                  arch = 'arm64' if 'arm64' in low else 'x64'
                  target_os, fmt, kind = 'macos', 'zip', 'bundle'
              else:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assets.append({
                  'os': target_os,
                  'arch': arch,
                  'name': name,
                  'format': fmt,
                  'kind': kind,
                  'sha256': digest,
                  'size': path.stat().st_size,
              })
          payload = {
              'version': '${{ needs.version.outputs.version }}',
              'tag': '${{ needs.version.outputs.tag }}',
              'assets': assets,
          }
          out = pathlib.Path('artifacts/update-manifest.json')
          out.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: artifacts/update-manifest.json
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [ version, build-windows, build-linux, build-macos, manifest ]
    if: needs.version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          TAG="${{ needs.version.outputs.tag }}"
          PREV=$(gh api "repos/$REPO/releases?per_page=1" --jq '.[0].tag_name // empty')
          FULL=$(gh api "repos/$REPO/commits/${{ github.sha }}" --jq '.commit.message' | tr -d '\r')
          MSG=$(printf '%s\n' "$FULL" | sed '1,/^$/d' | sed '1{/^#[[:space:]]/d}' | sed '/./,$!d')
          [ -z "$MSG" ] && MSG=$(printf '%s\n' "$FULL" | sed '1{/^#[[:space:]]/d}' | sed '/./,$!d')
          [ -z "$MSG" ] && MSG="${{ needs.version.outputs.app_name }} ${{ needs.version.outputs.display }}."
          {
            printf '%s\n\n' "$MSG"
            [ -n "$PREV" ] && printf '**Full Changelog:** https://github.com/%s/compare/%s...%s\n\n' "$REPO" "$PREV" "$TAG"
            cat <<'EOF'
          **Windows install:** download the MSI and run it. Choose the install location in the setup wizard. It installs for the current user with a Start Menu shortcut, no admin prompt, and no forced file associations.
          **Windows portable:** download the Windows ZIP, extract it, and run `${{ needs.version.outputs.app_name }}.exe`. The ZIP `.sha256` file contains the checksum used by the built-in updater; the MSI `.sha256` verifies the installer.
          **Linux:** download the tarball for your CPU (`x64` or `arm64`), extract it, and run `PiraChest`.
          **macOS:** download the ZIP for your Mac (`arm64` for Apple Silicon, `x64` for Intel), extract it, and move `PiraChest.app` to Applications.
          `update-manifest.json` lists every asset with its OS, architecture, format, and SHA-256 used by the built-in updater.
          EOF
          } > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "${{ needs.version.outputs.app_name }} ${{ needs.version.outputs.display }}"
          body_path: notes.md
          generate_release_notes: false
          prerelease: ${{ needs.version.outputs.canary == '1' }}
          make_latest: ${{ needs.version.outputs.canary != '1' }}
          fail_on_unmatched_files: true
          files: release-files/*

  discord:
    name: Announce on Discord
    needs: [ version, release ]
    if: needs.version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    env:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Post release to Discord
        if: env.WEBHOOK_URL != ''
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          REPO="${{ github.repository }}"
          EXPECTED_CHANNEL="1548012719779749910"
          ACTUAL_CHANNEL=$(curl -fsS "$WEBHOOK_URL" | jq -r '.channel_id')
          if [ "$ACTUAL_CHANNEL" != "$EXPECTED_CHANNEL" ]; then
            echo "::error::Webhook posts to channel $ACTUAL_CHANNEL, expected $EXPECTED_CHANNEL"
            exit 1
          fi
          JSON=$(gh release view "$TAG" --repo "$REPO" --json body,url,isPrerelease,assets)
          BODY=$(jq -r '.body' <<< "$JSON" | grep -vi '^\*\*\(install\|portable\|windows\|linux\|macos\|update-manifest\)' | grep -v '^`update-manifest' | sed -E 's/^#{2,3} (.*)$/**\1**/' | head -c 3800)
          URL=$(jq -r '.url' <<< "$JSON")
          MSI=$(jq -r '[.assets[].url | select(endswith(".msi"))][0] // empty' <<< "$JSON")
          ZIP=$(jq -r '[.assets[].url | select(contains("Windows") and endswith(".zip"))][0] // empty' <<< "$JSON")
          jq -n --arg role "<@&1548027542353477743>" --arg title "${{ needs.version.outputs.display }}" --arg url "$URL" \
                --arg body "$BODY" --arg msi "$MSI" --arg zip "$ZIP" --arg repo "$REPO" --arg app "${{ needs.version.outputs.app_name }}" '
            {username: "GitHub",
             avatar_url: "https://github.com/\($repo | split("/")[0]).png",
             content: $role,
             allowed_mentions: {parse: [], roles: ["1548027542353477743"]},
             embeds: [{title: $title, url: $url, color: 5814783,
                       description: ($body + "\n\n[Installer (MSI)](\($msi)) | [Portable (ZIP)](\($zip))"),
                       footer: {text: "\($app) Changelog"}}]}' > payload.json
          curl -fsS -H "Content-Type: application/json" -d @payload.json "$WEBHOOK_URL"

  chocolatey:
    name: Publish to Chocolatey
    needs: [ version, release ]
    if: needs.version.outputs.is_new == 'true' && needs.version.outputs.canary != '1'
    runs-on: windows-latest
    env:
      CHOCO_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release-files

      - name: Package and push (skipped without API key)
        if: env.CHOCO_KEY != ''
        shell: pwsh
        run: |
          $ver = "${{ needs.version.outputs.base }}"
          $tag = "${{ needs.version.outputs.tag }}"
          $repo = "${{ github.repository }}"
          $owner = "${{ github.repository_owner }}"
          $msi = "PiraChest-$tag-Windows-x64.msi"
          $sha = (Get-Content "release-files/$msi.sha256").Split()[0]
          $url = "https://github.com/$repo/releases/download/$tag/$msi"
          $iconUrl = "https://github.com/$repo/releases/download/$tag/PiraChest-icon.png"

          New-Item -ItemType Directory -Force pkg/tools | Out-Null

          @'
          $ErrorActionPreference = 'Stop'
          if (-not [Environment]::Is64BitOperatingSystem) { throw 'PiraChest is x64 only.' }
          Install-ChocolateyPackage `
            -PackageName $env:ChocolateyPackageName `
            -FileType 'msi' `
            -SilentArgs '/qn /norestart' `
            -Url64bit '__URL__' `
            -Checksum64 '__CHECKSUM__' `
            -ChecksumType64 'sha256' `
            -ValidExitCodes @(0, 3010)
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\PiraChest'
          $exe = Join-Path $dir 'PiraChest.exe'
          if (-not (Test-Path $exe)) { throw "PiraChest.exe missing at $exe after install." }
          Set-Content -Path (Join-Path $dir '.pirachest-choco') -Value '1' -Encoding ascii
          Install-BinFile -Name 'pirachest' -Path $exe
          '@.Replace('__URL__', $url).Replace('__CHECKSUM__', $sha) | Set-Content pkg/tools/chocolateyinstall.ps1 -Encoding utf8NoBOM

          @'
          $ErrorActionPreference = 'Stop'
          Uninstall-BinFile -Name 'pirachest'
          $keys = Get-UninstallRegistryKey -SoftwareName 'PiraChest*'
          foreach ($key in $keys) {
            Start-ChocolateyProcessAsAdmin -Statements "/x $($key.PSChildName) /qn /norestart" -ExeToRun 'msiexec.exe' -ValidExitCodes @(0, 3010, 1605, 1614, 1641)
          }
          '@ | Set-Content pkg/tools/chocolateyuninstall.ps1 -Encoding utf8NoBOM

          @"
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd">
            <metadata>
              <id>pirachest</id>
              <version>$ver</version>
              <title>PiraChest</title>
              <iconUrl>$iconUrl</iconUrl>
              <authors>$owner</authors>
              <projectUrl>https://github.com/$repo</projectUrl>
              <projectSourceUrl>https://github.com/$repo</projectSourceUrl>
              <packageSourceUrl>https://github.com/$repo</packageSourceUrl>
              <bugTrackerUrl>https://github.com/$repo/issues</bugTrackerUrl>
              <licenseUrl>https://github.com/$repo/blob/main/LICENSE</licenseUrl>
              <requireLicenseAcceptance>false</requireLicenseAcceptance>
              <releaseNotes>https://github.com/$repo/releases/tag/$tag</releaseNotes>
              <tags>pirachest windows desktop</tags>
              <summary>PiraChest for Windows (x64).</summary>
              <description>PiraChest is a Windows desktop application for games, movies, TV, anime, manga, books, and ROMs.</description>
            </metadata>
            <files>
              <file src="tools\**" target="tools" />
            </files>
          </package>
          "@ | Set-Content pkg/pirachest.nuspec -Encoding utf8NoBOM

          choco pack pkg/pirachest.nuspec --output-directory pkg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco push "pkg/pirachest.$ver.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCO_KEY
          exit $LASTEXITCODE

      - name: Skip Chocolatey
        if: env.CHOCO_KEY == ''
        shell: pwsh
        run: Write-Warning 'CHOCOLATEY_API_KEY is not set; skipping Chocolatey publish.'
