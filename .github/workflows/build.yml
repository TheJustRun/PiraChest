name: Build PiraChest (Windows x64)

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  version:
    name: Compute shared version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: echo "version=0.3.0" >> "$GITHUB_OUTPUT"

  build-windows:
    name: PyInstaller (Windows x64)
    needs: version
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt
          pip install --upgrade pyinstaller
          pip check

      - name: Write version file
        shell: pwsh
        run: |
          Set-Content -Path "VERSION" -Value "${{ needs.version.outputs.version }}" -NoNewline

      - name: Build with PyInstaller
        shell: cmd
        run: build.bat

      - name: Rename executable
        shell: pwsh
        run: |
          $exePath = "dist/PiraChest.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Expected build output at $exePath but it does not exist."
            exit 1
          }
          $exeName = "PiraChest-v${{ needs.version.outputs.version }}-alpha-Windows-x64.exe"
          $exePathOut = "${{ github.workspace }}\$exeName"
          Copy-Item -Path $exePath -Destination $exePathOut -Force
          echo "EXE_PATH=$exePathOut" >> $env:GITHUB_ENV

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: ${{ env.EXE_PATH }}

  release:
    name: Create Release
    needs: [ version, build-windows ]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release-files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.version.outputs.version }}-alpha"
          name: "PiraChest v${{ needs.version.outputs.version }} Alpha"
          body: "Automated alpha build from commit ${{ github.sha }}."
          draft: false
          prerelease: true
          files: release-files/*