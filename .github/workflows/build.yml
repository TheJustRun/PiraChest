name: Build PiraChest (Windows x64 + Linux AppImage)

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  version:
    name: Compute shared version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: echo "version=0.3.0" >> "$GITHUB_OUTPUT"

  build-windows:
    name: PyInstaller (Windows x64)
    needs: version
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt
          pip install --upgrade pyinstaller
          pip check

      - name: Write version file
        shell: pwsh
        run: |
          Set-Content -Path "VERSION" -Value "${{ needs.version.outputs.version }}" -NoNewline

      - name: Build with PyInstaller
        shell: cmd
        run: build.bat

      - name: Rename executable
        shell: pwsh
        run: |
          $exePath = "dist/PiraChest.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Expected build output at $exePath but it does not exist."
            exit 1
          }
          $exeName    = "PiraChest-v${{ needs.version.outputs.version }}-alpha-Windows-x64.exe"
          $exePathOut = "${{ github.workspace }}\$exeName"
          Copy-Item -Path $exePath -Destination $exePathOut -Force
          echo "EXE_PATH=$exePathOut" >> $env:GITHUB_ENV

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: ${{ env.EXE_PATH }}

  build-linux-appimage:
    name: PyInstaller (Linux AppImage)
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            libsqlite3-dev \
            libfuse2 \
            fuse \
            imagemagick \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install --upgrade pyinstaller
          pip check

      - name: Write version file
        run: echo -n "${{ needs.version.outputs.version }}" > VERSION

      - name: Run PyInstaller
        env:
          PYTHONOPTIMIZE: "2"
          PYINSTALLER_DISABLE_DISTUTILS_ALIAS: "1"
        run: |
          pyinstaller \
            --name=PiraChest \
            --onedir \
            --windowed \
            --noconfirm \
            --clean \
            --strip \
            --noupx \
            --optimize=2 \
            --icon=src/gui/photos/logo.ico \
            --exclude-module=PyQt5 \
            --exclude-module=PyQt6 \
            --exclude-module=PySide2 \
            --exclude-module=shiboken2 \
            --exclude-module=tkinter \
            --exclude-module=matplotlib \
            --exclude-module=numpy \
            --exclude-module=scipy \
            --exclude-module=setuptools \
            --exclude-module=pkg_resources \
            --exclude-module=av \
            --exclude-module=lxml \
            --exclude-module=PySide6.QtQml \
            --exclude-module=PySide6.QtQuick \
            --exclude-module=PySide6.QtQuickWidgets \
            --exclude-module=PySide6.QtQuickControls2 \
            --exclude-module=PySide6.QtQuick3D \
            --exclude-module=PySide6.QtWebEngineWidgets \
            --exclude-module=PySide6.QtWebEngineCore \
            --exclude-module=PySide6.QtWebEngineQuick \
            --exclude-module=PySide6.QtDesigner \
            --exclude-module=PySide6.QtBluetooth \
            --exclude-module=PySide6.QtNetworkAuth \
            --exclude-module=PySide6.QtNfc \
            --exclude-module=PySide6.QtPositioning \
            --exclude-module=PySide6.QtLocation \
            --exclude-module=PySide6.QtSensors \
            --exclude-module=PySide6.QtSerialPort \
            --exclude-module=PySide6.QtSerialBus \
            --exclude-module=PySide6.QtTest \
            --exclude-module=PySide6.QtOpenGL \
            --exclude-module=PySide6.QtOpenGLWidgets \
            --exclude-module=PySide6.QtPrintSupport \
            --exclude-module=PySide6.QtSql \
            --exclude-module=PySide6.QtHelp \
            --exclude-module=PySide6.QtUiTools \
            --exclude-module=PySide6.QtConcurrent \
            --exclude-module=PySide6.QtDBus \
            --exclude-module=PySide6.QtPdf \
            --exclude-module=PySide6.QtPdfWidgets \
            --exclude-module=PySide6.QtCharts \
            --exclude-module=PySide6.QtDataVisualization \
            --exclude-module=PySide6.QtRemoteObjects \
            --exclude-module=PySide6.QtSpatialAudio \
            --exclude-module=PySide6.QtStateMachine \
            --exclude-module=PySide6.QtTextToSpeech \
            --exclude-module=PySide6.QtWebChannel \
            --exclude-module=PySide6.QtWebSockets \
            --exclude-module=PySide6.Qt3DCore \
            --exclude-module=PySide6.Qt3DRender \
            --exclude-module=PySide6.Qt3DInput \
            --exclude-module=PySide6.Qt3DLogic \
            --exclude-module=PySide6.Qt3DAnimation \
            --exclude-module=PySide6.Qt3DExtras \
            --collect-all=httpx \
            --collect-all=curl_cffi \
            --collect-all=musicdl \
            --collect-all=yt_dlp \
            --collect-all=libgen_api_enhanced \
            --collect-all=qfluentwidgets \
            --collect-all=qframelesswindow \
            --collect-submodules=sqlite3 \
            --collect-submodules=http \
            --copy-metadata=yt-dlp \
            --copy-metadata=httpx \
            --copy-metadata=curl-cffi \
            --collect-binaries=PySide6 \
            --collect-binaries=libtorrent \
            --add-data "src/gui:src/gui" \
            --add-data "src/core:src/core" \
            --hidden-import=sqlite3 \
            --hidden-import=_sqlite3 \
            --hidden-import=http.server \
            --hidden-import=curl_cffi \
            --hidden-import=mutagen \
            --hidden-import=Crypto \
            src/main.py

      - name: Assemble AppDir
        run: |
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          cp -r dist/PiraChest/. AppDir/usr/bin/
          chmod +x AppDir/usr/bin/PiraChest
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/PiraChest.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=PiraChest
          Exec=PiraChest
          Icon=PiraChest
          Categories=Network;FileTransfer;
          Terminal=false
          EOF
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          if [ -f src/gui/photos/logo.ico ]; then
            convert src/gui/photos/logo.ico[0] -resize 256x256 -gravity center -background none -extent 256x256 AppDir/usr/share/icons/hicolor/256x256/apps/PiraChest.png
          elif [ -f src/gui/photos/logo.png ]; then
            convert src/gui/photos/logo.png -resize 256x256 -gravity center -background none -extent 256x256 AppDir/usr/share/icons/hicolor/256x256/apps/PiraChest.png
          else
            convert -size 256x256 xc:'#282828' AppDir/usr/share/icons/hicolor/256x256/apps/PiraChest.png
          fi

      - name: Fetch linuxdeploy
        run: |
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build AppImage
        env:
          ARCH: x86_64
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/PiraChest \
            --desktop-file AppDir/usr/share/applications/PiraChest.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/PiraChest.png \
            --output appimage
          APPIMAGE_FILE=$(ls PiraChest*.AppImage | head -n1)
          NEW_NAME="PiraChest-v${{ needs.version.outputs.version }}-alpha-Linux-x86_64.AppImage"
          mv "$APPIMAGE_FILE" "$NEW_NAME"
          echo "APPIMAGE_PATH=$NEW_NAME" >> "$GITHUB_ENV"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: ${{ env.APPIMAGE_PATH }}

  release:
    name: Create Permanent GitHub Release
    needs: [ version, build-windows, build-linux-appimage ]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: release-files

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: release-files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.version.outputs.version }}-alpha"
          name: "PiraChest v${{ needs.version.outputs.version }} Alpha"
          body: "Automated alpha build from commit ${{ github.sha }}."
          draft: false
          prerelease: true
          files: release-files/*