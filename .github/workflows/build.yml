# pyoxidizer.bzl - PiraChest configuration

def make_exe():
    # Get Python distribution
    dist = default_python_distribution()
    
    # Packaging policy
    policy = dist.make_python_packaging_policy()
    policy.include_test = False
    policy.include_distribution_sources = False
    policy.resources_location = "in-memory"
    
    # Python interpreter config
    python_config = dist.make_python_interpreter_config()
    python_config.run_module = "main"
    
    # Create executable
    exe = dist.to_python_executable(
        name="PiraChest",
        packaging_policy=policy,
        config=python_config,
    )
    
    # Add your source code
    exe.add_python_resources(
        exe.read_package_root(
            path="src",
            exclude=[
                "**/__pycache__",
                "**/*.pyc",
                "**/*.pyo",
                "**/tests",
            ]
        )
    )
    
    # Add data directories
    exe.add_resources(
        exe.read_directory("src/gui", "gui"),
        exe.read_directory("src/core", "core"),
    )
    
    return exe

# Register the build target
register_target("exe", make_exe)
resolve_targets("exe")
default_build_target = "exe"