name: Build macOS

on:
  workflow_call:
    inputs:
      base_build:
        type: string
        required: true
      nickname:
        type: string
        required: true
      canary:
        type: string
        required: true
      version:
        type: string
        required: true
      slug:
        type: string
        required: true
      app_name:
        type: string
        required: true
      channel:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-macos:
    name: PyInstaller (macOS ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: "14.0"
            machine: arm64
            floor: "14.0"
          - arch: x64
            runner: macos-15-intel
            target: "15.0"
            machine: x86_64
            floor: "15.0"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    continue-on-error: true
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Write version file
        shell: bash
        env:
          VERSION_BASE: ${{ inputs.base_build }}
          VERSION_NICK: ${{ inputs.nickname }}
          VERSION_CANARY: ${{ inputs.canary }}
        run: |
          printf '%s\n%s\n%s\n' "$VERSION_BASE" "$VERSION_NICK" "$VERSION_CANARY" > VERSION

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            python -m pip download --no-deps --only-binary=:all: \
              --python-version 3.13 --implementation cp --abi cp313 \
              --platform macosx_14_0_arm64 -d lowfloor \
              libtorrent==2.1.1 orjson==3.13.0
            python -m pip install lowfloor/*.whl
          fi
          python -m pip install -r requirements.txt pyinstaller==6.22.2 pyinstaller-hooks-contrib==2026.9

      - name: Build with PyInstaller
        env:
          SKIP_MSI: "1"
        run: python -m PyInstaller --noconfirm PiraChest.spec

      - name: Measure and set minimum macOS version
        env:
          MACHINE: ${{ matrix.machine }}
          LIMIT: ${{ matrix.floor }}
        run: |
          cat > patch.sh <<'S'
          for f in "$@"; do
            o=$(otool -arch "$MACHINE" -l "$f" 2>/dev/null) || continue
            read -r v sdk < <(awk '$1=="minos"{mv=$2} $1=="sdk"{sv=$2} $1=="cmd"&&$2=="LC_VERSION_MIN_MACOSX"{m=1} m&&$1=="version"{mv=$2} m&&$1=="sdk"{sv=$2; m=0} END{print mv, sv}' <<< "$o")
            [ -n "$v" ] || continue
            if [ "$(printf '%s\n%s\n' "$v" "$LIMIT" | sort -V | tail -n1)" != "$LIMIT" ]; then
              echo "::warning::$f declares minos $v; lowering to $LIMIT" >&2
              mode=$(stat -f %Lp "$f")
              vtool -set-build-version macos "$LIMIT" "${sdk:-$LIMIT}" -replace -output "$f.patched" "$f"
              mv "$f.patched" "$f"
              chmod "$mode" "$f"
              v="$LIMIT"
            fi
            echo "$v"
          done
          S
          export MACHINE LIMIT
          app="dist/${{ inputs.app_name }}.app"
          floor=$(find "$app" -type f \( -name '*.so' -o -name '*.dylib' -o -perm -u+x \) -print0 \
            | xargs -0 -n 50 -P "$(sysctl -n hw.ncpu)" bash patch.sh | sort -V | tail -n1)
          [ -n "$floor" ] || { echo "::error::Could not measure the macOS minimum version."; exit 1; }
          plist="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :LSMinimumSystemVersion" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string $floor" "$plist"
          echo "$floor" > "minos-${{ matrix.arch }}.txt"
          echo "macOS ${{ matrix.arch }} minimum version: $floor" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Package + checksum
        shell: bash
        run: |
          slug="${{ inputs.slug }}"
          app="${{ inputs.app_name }}.app"
          base="${{ inputs.base_build }}"
          mkdir -p package
          codesign --force --deep --sign - "dist/$app"
          name="$slug-$base-macOS-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/$app" "package/$name"
          rm -rf build/dmg
          mkdir -p build/dmg
          cp -R "dist/$app" "build/dmg/$app"
          ln -s /Applications build/dmg/Applications
          dmg="$slug-$base-macOS-${{ matrix.arch }}.dmg"
          for i in 1 2 3; do
            hdiutil create -quiet -volname "${{ inputs.app_name }}" \
              -srcfolder build/dmg -ov -format UDZO "package/$dmg" && break
            [ "$i" = 3 ] && exit 1
            sleep 10
          done
          cd package
          for f in *.zip *.dmg; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-package
          path: package/*
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-minos
          path: minos-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 3

