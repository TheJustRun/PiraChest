name: Release pipeline

# One run, in order: build + GitHub release -> README -> GitLab / SourceForge / Chocolatey -> Discord.
# Every stage lives in its own workflow file and can also be run on its own.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Called workflows can only use permissions granted here.
permissions:
  contents: write
  pull-requests: read

# One pipeline at a time so two quick pushes never race on the version/release check.
concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  build:
    name: Build and release
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # Updates README.md on main for a new stable release. Runs before the GitLab
  # mirror so GitLab receives the exact same commit (and the exact same README).
  readme:
    name: README
    needs: build
    if: needs.build.outputs.is_new == 'true'
    uses: ./.github/workflows/readme.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit

  # Mirrors run on every pipeline run (not only for new versions) so they also
  # catch up on anything they missed. A failure here never blocks the other stages.
  gitlab:
    name: GitLab
    needs: [ build, readme ]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/mirror-gitlab.yml
    secrets: inherit

  sourceforge:
    name: SourceForge
    needs: build
    uses: ./.github/workflows/mirror-sourceforge.yml
    secrets: inherit

  chocolatey:
    name: Chocolatey
    needs: build
    if: needs.build.outputs.is_new == 'true'
    uses: ./.github/workflows/chocolatey.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit

  # Announce last, once everything else has finished, whether or not a mirror
  # failed. Only for a brand-new release.
  discord:
    name: Discord
    needs: [ build, readme, gitlab, sourceforge, chocolatey ]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.is_new == 'true' }}
    uses: ./.github/workflows/discord.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
      title: ${{ needs.build.outputs.display }}
      app_name: ${{ needs.build.outputs.app_name }}
    secrets: inherit
