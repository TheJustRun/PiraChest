name: Release pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  gate:
    name: Check skip flag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "push" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq '.parents | length')" -gt 1 ]; then
            MSG="$(gh api "repos/$GITHUB_REPOSITORY/commits?sha=$SHA&per_page=30" \
              --jq '[.[] | select((.parents | length) == 1)][0].commit.message // ""')"
          fi
          if grep -qiE '(^|[[:space:]])/n([[:space:]]|$)' <<< "$MSG"; then
            echo "Commit message contains /n; skipping the pipeline."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and release
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit

  readme:
    name: README
    needs: build
    if: needs.build.outputs.is_new == 'true'
    uses: ./.github/workflows/readme.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit

  gitlab:
    name: GitLab
    needs: [ build, readme ]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    uses: ./.github/workflows/mirror-gitlab.yml
    secrets: inherit

  sourceforge:
    name: SourceForge
    needs: build
    uses: ./.github/workflows/mirror-sourceforge.yml
    secrets: inherit

  chocolatey:
    name: Chocolatey
    needs: build
    if: needs.build.outputs.is_new == 'true'
    uses: ./.github/workflows/chocolatey.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
    secrets: inherit

  discord:
    name: Discord
    needs: [ build, readme, gitlab, sourceforge, chocolatey ]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.is_new == 'true' }}
    uses: ./.github/workflows/discord.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
      title: ${{ needs.build.outputs.display }}
      app_name: ${{ needs.build.outputs.app_name }}
    secrets: inherit

  gitlab-code:
    name: GitLab (code only)
    needs: gate
    if: needs.gate.outputs.skip == 'true'
    uses: ./.github/workflows/mirror-gitlab.yml
    with:
      code_only: true
    secrets: inherit

  sourceforge-code:
    name: SourceForge (code only)
    needs: gate
    if: needs.gate.outputs.skip == 'true'
    uses: ./.github/workflows/mirror-sourceforge.yml
    with:
      code_only: true
    secrets: inherit

  summary:
    name: Summary
    needs: [ gate, build, readme, gitlab, sourceforge, chocolatey, discord, gitlab-code, sourceforge-code ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          {
            echo "## Release pipeline ${TAG:+· $TAG}"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result | {success:"✅ success", failure:"❌ failure", cancelled:"🚫 cancelled", skipped:"⏭️ skipped"}[.] // .) |"' <<< "$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"
