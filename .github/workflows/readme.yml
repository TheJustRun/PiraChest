name: Update README

on:
  push:
    branches: [ main ]
    paths:
      - README.md
  workflow_call:
    inputs:
      tag:
        description: "Release tag to show in the README"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to show in the README (e.g. v1.1.0-stable-2)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  gitlab:
    name: GitLab (code only)
    if: github.event_name == 'push'
    uses: ./.github/workflows/mirror-gitlab.yml
    with:
      code_only: true
    secrets: inherit

  readme:
    name: Update README
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Refresh latest-release block
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          if [ "$(gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq '.isPrerelease')" = "true" ]; then
            echo "::notice::$TAG is a pre-release; the README only tracks stable builds."
            exit 0
          fi

          if ! grep -q '<!-- latest:start -->' README.md || ! grep -q '<!-- latest:end -->' README.md; then
            echo "::warning::README.md has no <!-- latest:start --> / <!-- latest:end --> markers; skipping."
            exit 0
          fi

          MSI="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name | select(endswith("-Windows-x64.msi"))][0] // empty')"
          [ -n "$MSI" ] || { echo "::error::No Windows MSI found on $TAG."; exit 1; }
          PREFIX="${MSI%-Windows-x64.msi}"
          BASE="https://github.com/$REPO/releases/download/$TAG/$PREFIX"
          VERSION="${TAG#v}"

          cat > block.md <<EOF
          <!-- latest:start -->
          **Latest stable release: [$VERSION](https://github.com/$REPO/releases/tag/$TAG)**

          | Platform | Architecture | Download |
          | --- | --- | --- |
          | **Windows** | x64 | [Installer (.msi)]($BASE-Windows-x64.msi) · [Portable (.zip)]($BASE-Windows-x64.zip) |
          | **macOS** | Apple Silicon (arm64) | [Disk image (.dmg)]($BASE-macOS-arm64.dmg) · [Archive (.zip)]($BASE-macOS-arm64.zip) |
          | **macOS** | Intel (x64) | [Disk image (.dmg)]($BASE-macOS-x64.dmg) · [Archive (.zip)]($BASE-macOS-x64.zip) |
          | **Linux** | x64 | [Package (.deb)]($BASE-Linux-x64.deb) · [Archive (.tar.gz)]($BASE-Linux-x64.tar.gz) |
          | **Linux** | arm64 | [Package (.deb)]($BASE-Linux-arm64.deb) · [Archive (.tar.gz)]($BASE-Linux-arm64.tar.gz) |

          Mirrors: [GitLab](https://gitlab.com/TheJustRun/PiraChest/-/releases) · [SourceForge](https://sourceforge.net/projects/pirachest/files/)
          <!-- latest:end -->
          EOF
          sed -i 's/^          //' block.md

          python3 - <<'PY'
          import re, pathlib
          readme = pathlib.Path('README.md')
          block = pathlib.Path('block.md').read_text(encoding='utf-8').rstrip('\n')
          text = readme.read_text(encoding='utf-8')
          new = re.sub(r'<!-- latest:start -->.*?<!-- latest:end -->',
                       lambda m: block, text, flags=re.S)
          readme.write_text(new, encoding='utf-8')
          PY
          rm -f block.md

          if git diff --quiet -- README.md; then
            echo "README already up to date."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README for $TAG [skip ci]"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
