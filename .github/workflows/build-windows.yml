name: Build Windows

on:
  workflow_call:
    inputs:
      base_build:
        type: string
        required: true
      nickname:
        type: string
        required: true
      canary:
        type: string
        required: true
      version:
        type: string
        required: true
      slug:
        type: string
        required: true
      app_name:
        type: string
        required: true
      channel:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-windows:
    name: PyInstaller (Windows x64, onedir)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Write version file
        shell: pwsh
        env:
          VERSION_BASE: ${{ inputs.base_build }}
          VERSION_NICK: ${{ inputs.nickname }}
          VERSION_CANARY: ${{ inputs.canary }}
        run: |
          Set-Content -Path VERSION -Value @($env:VERSION_BASE, $env:VERSION_NICK, $env:VERSION_CANARY)

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2 2>$null
          if ($LASTEXITCODE -ne 0) { dotnet tool update --global wix --version 5.0.2 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build with PyInstaller
        shell: cmd
        env:
          SKIP_MSI: "1"
        run: build.bat

      - name: Build MSI installer
        shell: pwsh
        run: |
          $slug = "${{ inputs.slug }}"
          $brand = "${{ inputs.app_name }}"
          $exeName = "$brand.exe"
          $distDir = "dist/$slug"
          if (-not (Test-Path "$distDir/$exeName")) { Write-Error "Build output missing"; exit 1 }
          if (Test-Path "$distDir/data") { Remove-Item "$distDir/data" -Recurse -Force }
          New-Item -ItemType Directory -Force package | Out-Null
          $ver = ("${{ inputs.version }}" -split '-')[0]
          $exe = (Resolve-Path "$distDir/$exeName").Path
          $srcDir = (Resolve-Path $distDir).Path
          $canary = "${{ inputs.canary }}" -eq "1"
          $ico = if ($canary -and (Test-Path 'src/gui/photos/icon_c.ico')) { (Resolve-Path 'src/gui/photos/icon_c.ico').Path } elseif (Test-Path 'src/gui/photos/icon.ico') { (Resolve-Path 'src/gui/photos/icon.ico').Path } else { Get-ChildItem -Recurse -File -Filter *.ico | Where-Object { $_.FullName -notmatch '[\\/](dist|build|package|\.venv|venv|node_modules|site-packages)[\\/]' } | Sort-Object Length -Descending | Select-Object -First 1 -ExpandProperty FullName }
          $iconSrc = if ($ico) { $ico } else { $exe }
          Add-Type -AssemblyName System.Drawing
          $png = Join-Path $env:GITHUB_WORKSPACE "package/$slug-icon.png"
          try {
            $icon = if ($ico) { [System.Drawing.Icon]::new($ico, 256, 256) } else { [System.Drawing.Icon]::ExtractAssociatedIcon($exe) }
            $icon.ToBitmap().Save($png, [System.Drawing.Imaging.ImageFormat]::Png)
          } catch {
            [System.Drawing.Icon]::ExtractAssociatedIcon($exe).ToBitmap().Save($png, [System.Drawing.Imaging.ImageFormat]::Png)
          }
          $assets = Join-Path $env:GITHUB_WORKSPACE 'installer/assets'
          $dlgBmp = Join-Path $assets 'dialog.bmp'
          $banBmp = Join-Path $assets 'banner.bmp'
          if ($canary) {
            if (Test-Path (Join-Path $assets 'dialog_c.bmp')) { $dlgBmp = Join-Path $assets 'dialog_c.bmp' }
            if (Test-Path (Join-Path $assets 'banner_c.bmp')) { $banBmp = Join-Path $assets 'banner_c.bmp' }
          }
          foreach ($b in @($dlgBmp, $banBmp)) {
            if (-not (Test-Path $b)) { Write-Error "Missing installer art: $b"; exit 1 }
          }
          $msiName = "$slug-${{ inputs.base_build }}-Windows-x64.msi"
          $msi = Join-Path $env:GITHUB_WORKSPACE "package/$msiName"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $upgrade = if ($canary) { 'b7e0d3f2-9c41-4e8a-a6d5-2f7c1e9b4a68' } else { 'a3f6c2d1-7b4e-4c9a-8f2d-5e1b0c7a9d34' }
          wix build installer/PiraChest.wxs -arch x64 -pdbtype none -ext WixToolset.UI.wixext `
            -d Version=$ver -d SourceDir="$srcDir" -d IconFile="$iconSrc" -d DialogBmp="$dlgBmp" -d BannerBmp="$banBmp" `
            -d Brand="$brand" -d ExeName="$exeName" -d UpgradeCode="$upgrade" `
            -d Manufacturer="${{ github.repository_owner }}" -d ProjectUrl="https://github.com/${{ github.repository }}" `
            -o "$msi"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "MSI_PATH=$msi" >> $env:GITHUB_ENV

      - name: Zip + checksums
        shell: pwsh
        run: |
          $slug = "${{ inputs.slug }}"
          $name = "$slug-${{ inputs.base_build }}-Windows-x64.zip"
          $out = Join-Path $env:GITHUB_WORKSPACE "package/$name"
          Push-Location "dist/$slug"
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip -mx=9 -mmt=on "$out" * | Out-Null
          } else {
            Compress-Archive -Path * -DestinationPath $out -CompressionLevel Optimal
          }
          Pop-Location
          foreach ($f in @($out, $env:MSI_PATH)) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $f -Leaf)" | Set-Content "$f.sha256" -Encoding utf8NoBOM
          }
          $mb = [math]::Round((Get-ChildItem "dist/$slug" -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)
          "Onedir size: $mb MB" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: package/*
          if-no-files-found: error
          retention-days: 3

